name: cicd with aws ecr ecs

on:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16, 18, 20]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: install and lint frontend
        run: |
          cd frontend
          npm ci
          npm run lint

      - name: install and lint backend
        run: |
          cd backend
          npm ci
          npm run lint

  scan:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: scan frontend
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=critical

      - name: scan backend
        run: |
          cd backend
          npm ci
          npm audit --audit-level=high

  build:
    runs-on: ubuntu-latest
    needs: [lint, scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: aws login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: login to ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: build and push frontend
        run: |
          docker build -t ${{ secrets.ECR_REGISTRY }}/devboard-frontend:latest ./frontend
          docker tag ${{ secrets.ECR_REGISTRY }}/devboard-frontend:latest \
                     ${{ secrets.ECR_REGISTRY }}/devboard-frontend:${{ github.sha }}
          docker push ${{ secrets.ECR_REGISTRY }}/devboard-frontend:latest
          docker push ${{ secrets.ECR_REGISTRY }}/devboard-frontend:${{ github.sha }}

      - name: build and push backend
        run: |
          docker build -t ${{ secrets.ECR_REGISTRY }}/devboard-backend:latest ./backend
          docker tag ${{ secrets.ECR_REGISTRY }}/devboard-backend:latest \
                     ${{ secrets.ECR_REGISTRY }}/devboard-backend:${{ github.sha }}
          docker push ${{ secrets.ECR_REGISTRY }}/devboard-backend:latest
          docker push ${{ secrets.ECR_REGISTRY }}/devboard-backend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: aws login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: deploy to ecs
        run: |
          aws ecs update-service \
            --cluster devboard-cluster \
            --service devboard-backend-service \
            --force-new-deployment

      - name: deploy to ecs
        run: |
          aws ecs update-service \
            --cluster devboard-cluster \
            --service devboard-frontend-service \
            --force-new-deployment
